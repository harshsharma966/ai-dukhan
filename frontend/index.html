<!doctype html>
<html lang="hi" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">किराना दुकान AI - Smart POS & Stock Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#15803D',
                hover: '#166534',
                light: '#DCFCE7',
                50: '#F0FDF4',
                100: '#DCFCE7',
                600: '#16A34A',
                700: '#15803D',
                800: '#166534',
                900: '#14532D',
              },
              saffron: {
                DEFAULT: '#F59E0B',
                hover: '#D97706',
                light: '#FEF3C7',
                50: '#FFFBEB',
                100: '#FEF3C7',
                200: '#FDE68A',
                500: '#F59E0B',
                600: '#D97706',
                700: '#B45309',
                800: '#92400E',
              },
              charcoal: '#1C1917',
              stonegray: '#78716C',
              warmbg: '#FAFAF7',
              softborder: '#E7E5E4',
            }
          }
        }
      }
    </script>
    <!-- FontAwesome / Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #FAFAF7;
        color: #1C1917;
      }
      .tab-active {
        border-bottom: 3px solid #15803D !important;
        color: #15803D !important;
        font-weight: 700 !important;
      }
      .border-soft {
        border-color: #E7E5E4;
      }
      /* Scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #FAFAF7; }
      ::-webkit-scrollbar-thumb { background: #D6D3D1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #A8A29E; }
      /* Print optimization: Print ONLY the receipt on a single clean page */
      @media print {
        body * {
          visibility: hidden !important;
        }
        #modal-receipt, #modal-receipt * {
          visibility: visible !important;
        }
        #modal-receipt {
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          height: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          display: block !important;
          z-index: 999999 !important;
        }
        #modal-receipt > div {
          max-width: 380px !important;
          width: 100% !important;
          margin: 0 auto !important;
          box-shadow: none !important;
          border: 1px dashed #78716C !important;
          padding: 10px !important;
          page-break-after: avoid !important;
          page-break-inside: avoid !important;
        }
        #modal-receipt button {
          display: none !important;
        }
        @page {
          margin: 4mm !important;
          size: auto !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#FAFAF7] text-[#1C1917] antialiased min-h-screen flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
